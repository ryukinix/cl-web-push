<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CL Web Push Autonomous E2E Test</title>
  <style>
    body { font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: 2em auto; padding: 0 1em; }
    .status { padding: 1em; border-radius: 4px; margin: 1em 0; }
    .pending { background: #fff3cd; color: #856404; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h1>Web Push Autonomous E2E Test</h1>
  <div id="status" class="status pending">Initializing test...</div>
  
  <h3>Log:</h3>
  <pre id="log"></pre>

  <script>
    const statusDiv = document.getElementById('status');
    const logPre = document.getElementById('log');

    function log(msg) {
      logPre.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
      console.log(msg);
    }

    function updateStatus(text, className) {
      statusDiv.textContent = text;
      statusDiv.className = `status ${className}`;
    }

    // Utility to convert Base64-URL to Uint8Array for the browser API
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    async function runTest() {
      try {
        log('Fetching VAPID public key...');
        const pubKeyResponse = await fetch('/vapid-pub');
        const vapidKey = await pubKeyResponse.text();
        log(`Public Key: ${vapidKey}`);

        log('Registering Service Worker...');
        const reg = await navigator.serviceWorker.register('sw.js');
        log('Service Worker registered.');

        // Wait for SW to be ready
        await navigator.serviceWorker.ready;
        log('Service Worker ready.');

        log('Requesting subscription...');
        const subscription = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(vapidKey)
        });
        log('Subscription obtained.');

        log('Sending subscription to server...');
        const subResponse = await fetch('/subscribe', {
          method: 'POST',
          body: JSON.stringify(subscription),
          headers: { 'Content-Type': 'application/json' }
        });
        
        if (subResponse.ok) {
          log('Subscription sent. Waiting for push notification...');
          updateStatus('Waiting for push notification...', 'pending');
        } else {
          throw new Error('Failed to send subscription to server');
        }

      } catch (err) {
        log(`ERROR: ${err.message}`);
        updateStatus(`Test Failed: ${err.message}`, 'error');
      }
    }

    // Listen for messages from the service worker
    navigator.serviceWorker.addEventListener('message', async (event) => {
      if (event.data === 'received') {
        log('Push notification received by Service Worker!');
        updateStatus('Notification received! Verifying...', 'success');
        
        try {
          const verifyResponse = await fetch('/verify-received', { method: 'POST' });
          if (verifyResponse.ok) {
            log('Test verified successfully!');
            updateStatus('Test Success! You can close this window.', 'success');
          }
        } catch (err) {
          log(`Verification failed: ${err.message}`);
        }
      }
    });

    // Start the test
    if ('serviceWorker' in navigator && 'PushManager' in window) {
      runTest();
    } else {
      log('Web Push is not supported in this browser.');
      updateStatus('Web Push not supported', 'error');
    }
  </script>
</body>
</html>
